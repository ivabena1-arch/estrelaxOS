<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>estrelaxOS forum</title>

<meta name="description" content="Foro oficial de estrelaxOS. Comparte publicaciones y conversa con la comunidad.">
<meta name="robots" content="index, follow">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: white;
    color: black;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px 4%;
    border-bottom: 3px solid black;
    font-size: 22px;
}

header a {
    color: black;
    text-decoration: none;
}

header em {
    font-family: cursive;
    font-size: 32px;
}

main {
    flex: 1;
    padding: 10vw 18px 50px;
}

.toolbar {
    display: flex;
    justify-content: flex-end;
    margin: 0 5% 10px;
}

button {
    background: white;
    color: black;
    border: 3px solid black;
    padding: 18px;
    cursor: pointer;
    font-size: 16px;
}

button:hover:not(:disabled) {
    background: black;
    color: white;
}

button:disabled {
    opacity: 0.5;
    cursor: wait;
}

#posts {
    border: 3px solid black;
    min-height: 400px;
    padding: 20px;
}

.post {
    padding: 15px;
    border-bottom: 1px solid black;
    overflow-wrap: anywhere;
}

.post p {
    white-space: pre-wrap;
}

.post small {
    color: #555;
}

.reply-button {
    border: 2px solid black;
    padding: 10px 18px;
    font-size: 14px;
    margin-right: 12px;
}

.replies {
    margin-top: 20px;
    padding-left: 20px;
    border-left: 2px solid black;
}

.reply {
    padding: 12px 0;
    border-bottom: 1px solid #ccc;
}

.reply:last-child {
    border-bottom: none;
}

.reply p {
    margin: 8px 0;
}

.reply strong {
    display: block;
    margin-bottom: 5px;
}

.reply-count {
    font-size: 14px;
    color: #555;
}

dialog {
    border: 3px solid black;
    width: min(500px, 90%);
    max-height: 90vh;
    overflow-y: auto;
    padding: 25px;
}

dialog::backdrop {
    background: #0006;
}

input, textarea {
    width: 100%;
    border: 2px solid black;
    padding: 12px;
    margin-bottom: 15px;
    font: inherit;
}

textarea {
    min-height: 150px;
    resize: vertical;
}

footer {
    border-top: 3px solid black;
    text-align: center;
    padding: 20px;
}

footer a {
    color: black;
}

#replyTo {
    overflow-wrap: anywhere;
}
</style>
</head>

<body>

<header>
    <svg width="45" height="55" viewBox="0 0 45 55">
        <path d="M3 19 L12 4 L22 19 L33 4 L42 19 V52 H3 Z M3 19 H42"
              fill="none"
              stroke="black"
              stroke-width="2.5"/>
    </svg>

    <a href="index.html">estrelaxOS</a>
    <em>forum</em>
</header>

<main>

    <div class="toolbar">
        <button id="open">crear una publicación</button>
    </div>

    <section id="posts" aria-live="polite">
        Cargando publicaciones...
    </section>

</main>

<!-- Ventana para crear publicaciones -->

<dialog id="modal">

    <h2>Crear una publicación</h2>

    <form id="postForm">

        <label for="author">Nombre de usuario</label>

        <input id="author"
               placeholder="Tu nombre de usuario"
               maxlength="40"
               required>

        <label for="title">Título</label>

        <input id="title"
               placeholder="Título"
               maxlength="150"
               required>

        <label for="content">Publicación</label>

        <textarea id="content"
                  placeholder="Escribe tu publicación..."
                  maxlength="5000"
                  required></textarea>

        <button type="submit" id="publish">
            Publicar
        </button>

        <button type="button" id="close">
            Cancelar
        </button>

        <p id="status" role="status"></p>

    </form>

</dialog>

<!-- Ventana para responder publicaciones -->

<dialog id="replyModal">

    <h2>Responder publicación</h2>

    <p id="replyTo"></p>

    <form id="replyForm">

        <label for="replyAuthor">Nombre de usuario</label>

        <input id="replyAuthor"
               placeholder="Tu nombre de usuario"
               maxlength="40"
               required>

        <label for="replyContent">Tu respuesta</label>

        <textarea id="replyContent"
                  placeholder="Escribe tu respuesta..."
                  maxlength="5000"
                  required></textarea>

        <button type="submit" id="publishReply">
            Publicar respuesta
        </button>

        <button type="button" id="closeReply">
            Cancelar
        </button>

        <p id="replyStatus" role="status"></p>

    </form>

</dialog>

<footer>
    <a href="index.html">volver al inicio</a>
</footer>

<script>

const URL_SUPABASE =
    "https://zcnvidliedwjfmjgoowr.supabase.co";

const PUBLIC_KEY =
    "sb_publishable_imu6QQNs89lWMlFcgJhaOA_kr8hspQo";

const db = window.supabase.createClient(
    URL_SUPABASE,
    PUBLIC_KEY
);

const posts = document.getElementById("posts");
const modal = document.getElementById("modal");
const form = document.getElementById("postForm");
const status = document.getElementById("status");
const publish = document.getElementById("publish");

const replyModal = document.getElementById("replyModal");
const replyForm = document.getElementById("replyForm");
const replyStatus = document.getElementById("replyStatus");
const publishReply = document.getElementById("publishReply");

let selectedPostId = null;
let loading = false;
let lastSnapshot = null;

// Abrir ventana de publicaciones

document.getElementById("open").onclick = () => {
    status.textContent = "";
    modal.showModal();
};

document.getElementById("close").onclick = () => {
    if (!publish.disabled) {
        modal.close();
    }
};

// Cerrar ventana de respuestas

document.getElementById("closeReply").onclick = () => {
    if (!publishReply.disabled) {
        replyModal.close();
    }
};

modal.addEventListener("cancel", event => {
    if (publish.disabled) event.preventDefault();
});

replyModal.addEventListener("cancel", event => {
    if (publishReply.disabled) event.preventDefault();
});

// Iniciar sesión anónima

async function iniciarSesion() {

    const { data, error } =
        await db.auth.getSession();

    if (error) throw error;

    if (!data.session) {

        const { error: loginError } =
            await db.auth.signInAnonymously();

        if (loginError) throw loginError;
    }
}

// Formatear fecha

function fecha(valor) {
    return new Date(valor).toLocaleString("es-CL");
}

// Abrir formulario de respuesta

function responder(post) {

    selectedPostId = post.id;

    replyForm.reset();

    document.getElementById("replyTo").textContent =
        "Respondiendo a: " + post.title;

    replyStatus.textContent = "";

    replyModal.showModal();
}

// Cargar publicaciones y respuestas

async function cargarPublicaciones() {

    if (loading) return;

    loading = true;

    try {

        const { data: publicaciones, error } = await db
            .from("posts")
            .select("id, author, title, content, created_at")
            .order("created_at", { ascending: false })
            .limit(100);

        if (error) throw error;

        if (publicaciones.length === 0) {

            posts.textContent =
                "Todavía no hay publicaciones.";

            lastSnapshot = null;

            return;
        }

        const ids = publicaciones.map(post => post.id);

        const respuestas = [];

        // Cargar respuestas por páginas

        for (let inicio = 0; ; inicio += 500) {

            const { data, error: replyError } = await db
                .from("replies")
                .select("id, post_id, author, content, created_at")
                .in("post_id", ids)
                .order("created_at", { ascending: true })
                .order("id", { ascending: true })
                .range(inicio, inicio + 499);

            if (replyError) throw replyError;

            respuestas.push(...data);

            if (data.length < 500) break;
        }

        const snapshot = JSON.stringify([
            publicaciones,
            respuestas
        ]);

        if (snapshot === lastSnapshot) return;

        const fragment = document.createDocumentFragment();

        const grupos = new Map();

        for (const respuesta of respuestas) {

            const id = String(respuesta.post_id);

            if (!grupos.has(id)) {
                grupos.set(id, []);
            }

            grupos.get(id).push(respuesta);
        }

        for (const post of publicaciones) {

            const article = document.createElement("article");
            article.className = "post";

            const title = document.createElement("h2");
            title.textContent = post.title;

            const author = document.createElement("small");

            author.textContent =
                post.author + " — " + fecha(post.created_at);

            const content = document.createElement("p");
            content.textContent = post.content;

            const boton = document.createElement("button");
            boton.className = "reply-button";
            boton.textContent = "responder";

            boton.onclick = () => responder(post);

            const comentarios =
                grupos.get(String(post.id)) || [];

            const contador = document.createElement("span");
            contador.className = "reply-count";

            contador.textContent =
                comentarios.length +
                (comentarios.length === 1
                    ? " respuesta"
                    : " respuestas");

            article.append(
                title,
                author,
                content,
                boton,
                contador
            );

            if (comentarios.length > 0) {

                const lista = document.createElement("div");
                lista.className = "replies";

                for (const respuesta of comentarios) {

                    const item = document.createElement("div");
                    item.className = "reply";

                    const nombre = document.createElement("strong");
                    nombre.textContent = respuesta.author;

                    const hora = document.createElement("small");
                    hora.textContent = fecha(respuesta.created_at);

                    const mensaje = document.createElement("p");
                    mensaje.textContent = respuesta.content;

                    item.append(nombre, hora, mensaje);

                    lista.appendChild(item);
                }

                article.appendChild(lista);
            }

            fragment.appendChild(article);
        }

        posts.replaceChildren(fragment);

        lastSnapshot = snapshot;

    } catch (error) {

        posts.textContent =
            "No se pudo conectar al foro: " + error.message;

        lastSnapshot = null;

        console.error(error);

    } finally {

        loading = false;
    }
}

// Publicar una nueva publicación

form.addEventListener("submit", async event => {

    event.preventDefault();

    if (publish.disabled) return;

    publish.disabled = true;
    status.textContent = "Publicando...";

    try {

        const author =
            document.getElementById("author").value.trim();

        const title =
            document.getElementById("title").value.trim();

        const content =
            document.getElementById("content").value.trim();

        if (!author || !title || !content) {
            throw new Error("Completa todos los campos.");
        }

        await iniciarSesion();

        const { error } = await db
            .from("posts")
            .insert({
                author,
                title,
                content
            });

        if (error) throw error;

        form.reset();

        modal.close();

        await cargarPublicaciones();

    } catch (error) {

        status.textContent =
            "Error: " + error.message;

    } finally {

        publish.disabled = false;
    }
});

// Publicar una respuesta

replyForm.addEventListener("submit", async event => {

    event.preventDefault();

    if (publishReply.disabled) return;

    publishReply.disabled = true;

    replyStatus.textContent = "Publicando respuesta...";

    try {

        const author =
            document.getElementById("replyAuthor").value.trim();

        const content =
            document.getElementById("replyContent").value.trim();

        if (!author || !content) {
            throw new Error("Completa todos los campos.");
        }

        if (selectedPostId === null) {
            throw new Error("Publicación no seleccionada.");
        }

        await iniciarSesion();

        const { error } = await db
            .from("replies")
            .insert({
                post_id: selectedPostId,
                author,
                content
            });

        if (error) throw error;

        replyForm.reset();

        replyModal.close();

        selectedPostId = null;

        await cargarPublicaciones();

    } catch (error) {

        replyStatus.textContent =
            "Error: " + error.message;

    } finally {

        publishReply.disabled = false;
    }
});

// Actualizar automáticamente

cargarPublicaciones();

setInterval(cargarPublicaciones, 15000);

</script>

</body>
</html>
