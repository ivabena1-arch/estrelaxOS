
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>estrelaxOS forum</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: white;
    color: black;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px 4%;
    border-bottom: 3px solid black;
    font-size: 22px;
}

header a {
    color: black;
    text-decoration: none;
}

header em {
    font-family: cursive;
    font-size: 32px;
}

main {
    flex: 1;
    padding: 10vw 18px 50px;
}

.toolbar {
    display: flex;
    justify-content: flex-end;
    margin: 0 5% 10px;
}

button {
    background: white;
    color: black;
    border: 3px solid black;
    padding: 18px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: black;
    color: white;
}

button:disabled {
    opacity: 0.5;
    cursor: wait;
}

#posts {
    border: 3px solid black;
    min-height: 400px;
    padding: 20px;
}

.post {
    padding: 15px;
    border-bottom: 1px solid black;
    overflow-wrap: anywhere;
}

.post p {
    white-space: pre-wrap;
}

.post small {
    color: #555;
}

dialog {
    border: 3px solid black;
    width: min(500px, 90%);
    padding: 25px;
}

dialog::backdrop {
    background: #0006;
}

input, textarea {
    width: 100%;
    border: 2px solid black;
    padding: 12px;
    margin-bottom: 15px;
    font: inherit;
}

textarea {
    min-height: 150px;
    resize: vertical;
}

footer {
    border-top: 3px solid black;
    text-align: center;
    padding: 20px;
}

footer a {
    color: black;
}
</style>
</head>

<body>

<header>
    <svg width="45" height="55" viewBox="0 0 45 55">
        <path d="M3 19 L12 4 L22 19 L33 4 L42 19 V52 H3 Z M3 19 H42"
              fill="none"
              stroke="black"
              stroke-width="2.5"/>
    </svg>

    <a href="index.html">estrelaxOS</a>
    <em>forum</em>
</header>

<main>
    <div class="toolbar">
        <button id="open">crear una publicación</button>
    </div>

    <section id="posts" aria-live="polite">
        Cargando publicaciones...
    </section>
</main>

<dialog id="modal">
    <h2>Crear una publicación</h2>

    <form id="postForm">

        <label for="author">Nombre de usuario</label>
        <input id="author"
               placeholder="Tu nombre de usuario"
               maxlength="40"
               required>

        <label for="title">Título</label>
        <input id="title"
               placeholder="Título"
               maxlength="150"
               required>

        <label for="content">Publicación</label>
        <textarea id="content"
                  placeholder="Escribe tu publicación..."
                  maxlength="5000"
                  required></textarea>

        <button type="submit" id="publish">
            Publicar
        </button>

        <button type="button" id="close">
            Cancelar
        </button>

        <p id="status" role="status"></p>
    </form>
</dialog>

<footer>
    <a href="index.html">volver al inicio</a>
</footer>

<script>

const URL_SUPABASE =
    "https://zcnvidliedwjfmjgoowr.supabase.co";

const PUBLIC_KEY =
    "sb_publishable_imu6QQNs89lWMlFcgJhaOA_kr8hspQo";

const db = window.supabase.createClient(
    URL_SUPABASE,
    PUBLIC_KEY
);

const posts = document.getElementById("posts");
const modal = document.getElementById("modal");
const form = document.getElementById("postForm");
const status = document.getElementById("status");
const publish = document.getElementById("publish");

document.getElementById("open").onclick = () => {
    status.textContent = "";
    modal.showModal();
};

document.getElementById("close").onclick = () => {
    modal.close();
};

async function cargarPublicaciones() {
    try {
        const { data, error } = await db
            .from("posts")
            .select("id, author, title, content, created_at")
            .order("created_at", { ascending: false })
            .limit(100);

        if (error) throw error;

        posts.replaceChildren();

        if (data.length === 0) {
            posts.textContent =
                "Todavía no hay publicaciones.";
            return;
        }

        for (const post of data) {

            const article = document.createElement("article");
            article.className = "post";

            const title = document.createElement("h2");
            title.textContent = post.title;

            const author = document.createElement("small");
            author.textContent =
                post.author + " — " +
                new Date(post.created_at)
                    .toLocaleString("es-CL");

            const content = document.createElement("p");
            content.textContent = post.content;

            article.append(title, author, content);
            posts.appendChild(article);
        }

    } catch (error) {
        posts.textContent =
            "No se pudo conectar al foro: " + error.message;

        console.error(error);
    }
}

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    publish.disabled = true;
    status.textContent = "Publicando...";

    try {

        const author =
            document.getElementById("author").value.trim();

        const title =
            document.getElementById("title").value.trim();

        const content =
            document.getElementById("content").value.trim();

        if (!author || !title || !content) {
            throw new Error("Completa todos los campos.");
        }

        const { data, error: sessionError } =
            await db.auth.getSession();

        if (sessionError) throw sessionError;

        if (!data.session) {

            const { error } =
                await db.auth.signInAnonymously();

            if (error) throw error;
        }

        const { error } = await db
            .from("posts")
            .insert({
                author,
                title,
                content
            });

        if (error) throw error;

        form.reset();
        modal.close();

        await cargarPublicaciones();

    } catch (error) {

        status.textContent =
            "Error: " + error.message;

    } finally {

        publish.disabled = false;

    }
});

cargarPublicaciones();

setInterval(cargarPublicaciones, 15000);

</script>

</body>
</html>
